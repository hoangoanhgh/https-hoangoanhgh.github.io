<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#5c0910">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://script.google.com">
    <title>HOÀNG OANH | Thời Trang Nữ · Mặc Đẹp Mỗi Ngày</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --crimson: #7a1218;
            --crimson-dark: #4f080d;
            --coral: #d94a38;
            --gold: #c59b41;
            --gold-light: #f5d98b;
            --cream: #f8efe6;
            --cream-card: #fffaf5;
            --line: #e6d6c6;
            --text: #2a1810;
            --muted: #6e5a4f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 84px; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        [hidden] { display: none !important; }

        /* ===== HEADER ===== */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(248, 239, 230, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            padding: 14px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .m-menu-btn { display: none; background: none; border: 0; font-size: 1.35rem; color: var(--text); cursor: pointer; padding: 6px; }
        .brand { text-decoration: none; display: flex; flex-direction: column; align-items: flex-start; position: relative; }
        .brand-crown { display: none; width: 28px; height: 20px; margin-bottom: -4px; transform: rotate(-10deg); }
        .brand-title { font-family: 'Playfair Display', serif; font-size: clamp(1.35rem, 2.2vw, 1.85rem); font-weight: 700; letter-spacing: 2px; color: #2b1810; line-height: 1.1; }
        .brand-title span { color: var(--coral); }
        .brand-sub { display: none; font-family: 'Dancing Script', cursive; font-size: 0.98rem; color: #3d251b; margin-top: 2px; }
        .nav-menu { display: flex; align-items: center; gap: clamp(16px, 2.2vw, 32px); list-style: none; }
        .nav-menu a { text-decoration: none; color: var(--text); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; padding: 6px 0; border-bottom: 2px solid transparent; transition: .2s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--crimson); border-bottom-color: var(--crimson); }
        .header-actions { display: flex; align-items: center; gap: 16px; }
        .hotline-top { text-decoration: none; color: var(--crimson); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; padding-right: 14px; border-right: 1px solid var(--line); }
        .icon-btn { background: none; border: 0; color: var(--text); font-size: 1.15rem; cursor: pointer; position: relative; padding: 6px; transition: transform .2s, color .2s; }
        .icon-btn:hover { color: var(--crimson); transform: translateY(-1px); }
        .badge-count { position: absolute; top: -2px; right: -4px; background: var(--crimson); color: #fff; font-size: 0.68rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }

        /* ===== BANNER BẰNG THẺ PICTURE ===== */
        .hero-banner-wrap { position: relative; width: 100%; background: var(--cream); overflow: hidden; display: block; }
        .hero-banner-wrap picture img { width: 100%; height: auto; display: block; object-fit: contain; }
        
        /* Vùng bấm thông minh trên Banner Desktop */
        .hotspot { position: absolute; z-index: 5; cursor: pointer; border-radius: 999px; }
        .hs-d-collection { left: 5.45%; top: 79.62%; width: 20.52%; height: 11.06%; }
        .hs-d-call       { left: 27.58%; top: 80.73%; width: 12.83%; height: 9%; }
        
        /* Vùng bấm thông minh trên Banner Mobile */
        .hs-m-call  { display: none; left: 6.22%; top: 87.89%; width: 50.8%; height: 8.18%; }

        @media (max-width: 768px) {
            header { padding: 10px 4%; }
            .m-menu-btn { display: inline-flex; }
            .nav-menu, .hotline-top { display: none; }
            .brand { align-items: center; margin: 0 auto; }
            .brand-crown, .brand-sub { display: block; }
            
            /* Đổi hotspot sang mobile */
            .hs-d-collection, .hs-d-call { display: none; }
            .hs-m-call { display: block; }
        }

        /* ===== KHU VỰC SẢN PHẨM & BỘ LỌC ===== */
        .section-wrap { max-width: 1340px; margin: 0 auto; padding: clamp(36px, 5vw, 68px) 4%; }
        .section-head { text-align: center; margin-bottom: 28px; }
        .section-eyebrow { color: var(--crimson); font-size: 0.76rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
        .section-head h2 { font-size: clamp(1.7rem, 3.8vw, 2.5rem); color: var(--text); letter-spacing: 2px; position: relative; display: inline-block; padding-bottom: 12px; }
        .section-head h2::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 64px; height: 2px; background: var(--gold); }
        .toolbar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; max-width: 1080px; margin: 0 auto 22px; }
        .search { position: relative; flex: 1 1 260px; }
        .search i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--crimson); }
        .search input, .toolbar select { width: 100%; padding: 13px 16px; border: 1px solid var(--line); border-radius: 999px; font: inherit; font-size: 0.92rem; background: #fff; outline: none; }
        .search input { padding-left: 44px; }
        .chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
        .chip { border: 1px solid var(--line); background: #fff; padding: 9px 20px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .chip.on { background: var(--crimson); color: #fff; border-color: var(--crimson); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 275px), 1fr)); gap: clamp(18px, 2.6vw, 32px); }
        .product-card { background: var(--cream-card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; transition: .3s; }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(60, 20, 10, 0.12); }
        .img-wrap { aspect-ratio: 3/4; overflow: hidden; background: #f3e5d7; cursor: pointer; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: .6s; }
        .product-card:hover .product-img { transform: scale(1.06); }
        .product-info { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .product-cat { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
        .product-info h3 { font-size: 1.08rem; font-weight: 600; margin-bottom: 6px; }
        .product-price { color: var(--crimson); font-weight: 700; font-size: 1.05rem; margin-bottom: 14px; }
        .card-actions { margin-top: auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
        .btn-buy-now { padding: 10px 14px; background: linear-gradient(135deg, var(--crimson), var(--crimson-dark)); color: #fff; border: 0; border-radius: 10px; font: inherit; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
        .btn-quick-cart { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--gold); background: #fff; color: var(--crimson); cursor: pointer; }

        /* ===== MODAL & CART ===== */
        .modal, .drawer-backdrop { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
        .drawer-backdrop { justify-content: flex-end; padding: 0; }
        .modal-box { background: var(--cream-card); width: min(100%, 960px); max-height: 92vh; overflow-y: auto; border-radius: 20px; display: grid; grid-template-columns: 1fr 1fr; position: relative; }
        .drawer { width: min(100%, 460px); height: 100%; background: var(--cream-card); display: flex; flex-direction: column; }
        .modal-x, .drawer-close { position: absolute; top: 12px; right: 12px; z-index: 10; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); font-size: 1.5rem; cursor: pointer; }
        .drawer-close { position: static; background: none; color: #fff; width: auto; height: auto; }
        .m-gal img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
        .m-side { padding: 30px 28px; display: flex; flex-direction: column; gap: 14px; }
        .size-options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .size-btn { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
        .size-btn.active { background: var(--crimson); color: #fff; border-color: var(--crimson); }
        .form-input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 0.9rem; }
        
        .drawer-head { padding: 18px 22px; background: var(--crimson); color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
        .cart-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
        .cart-item img { width: 60px; height: 80px; object-fit: cover; border-radius: 8px; }

        @media (max-width: 768px) {
            .modal-box { grid-template-columns: 1fr; border-radius: 20px 20px 0 0; align-self: flex-end; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <button class="m-menu-btn" id="btn-m-menu"><i class="fa-solid fa-bars"></i></button>
        <a href="#" class="brand">
            <div class="brand-title">HOÀNG <span>OANH</span></div>
            <div class="brand-sub">Thời trang nữ · Mặc đẹp mỗi ngày</div>
        </a>
        <ul class="nav-menu">
            <li><a href="#" class="active">Trang chủ</a></li>
            <li><a href="#san-pham">Sản phẩm</a></li>
            <li><a href="#footer">Liên hệ</a></li>
        </ul>
        <div class="header-actions">
            <a href="tel:0978612816" class="hotline-top"><i class="fa-solid fa-phone"></i> 0978 612 816</a>
            <button class="icon-btn" id="btn-open-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge-count" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- BANNER PICTURE (TỰ ĐỘNG CHỌN ẢNH THEO MÀN HÌNH) -->
    <section class="hero-banner-wrap" aria-label="Banner Hoàng Oanh">
        <picture>
            <source media="(max-width: 768px)" srcset="banner-dien-thoai.png" width="933" height="892">
            <img src="banner-may-tinh.png" width="1925" height="633" fetchpriority="high" alt="HOÀNG OANH - Thời trang nữ, mặc đẹp mỗi ngày. Giao hàng toàn quốc, đổi trả dễ dàng, tư vấn miễn phí. Gọi 0978 612 816.">
        </picture>
        
        <!-- Hotspots -->
        <a href="#san-pham" class="hotspot hs-d-collection" title="Xem bộ sưu tập"></a>
        <a href="tel:0978612816" class="hotspot hs-d-call" title="Gọi tư vấn 0978 612 816"></a>
        <a href="tel:0978612816" class="hotspot hs-m-call" title="Gọi ngay 0978 612 816"></a>
    </section>

    <!-- DANH SÁCH SẢN PHẨM -->
    <section id="san-pham" class="section-wrap">
        <div class="section-head">
            <p class="section-eyebrow">Bộ Sưu Tập Thượng Lưu</p>
            <h2>THIẾT KẾ MỚI NHẤT</h2>
        </div>
        <div class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="q" type="search" placeholder="Tìm tên đầm, váy lụa, vest...">
            </div>
            <select id="sort">
                <option value="new">Mới nhất</option>
                <option value="asc">Giá thấp → cao</option>
                <option value="desc">Giá cao → thấp</option>
            </select>
        </div>
        <div class="chips" id="chips"></div>
        <div class="product-grid" id="product-container"></div>
    </section>

    <!-- MODAL SẢN PHẨM -->
    <div id="modal" class="modal" hidden>
        <div class="modal-box">
            <button class="modal-x" id="m-close">&times;</button>
            <div class="m-gal"><img id="m-img" alt=""></div>
            <div class="m-side">
                <h3 id="m-prod" style="font-size:1.5rem"></h3>
                <div id="m-price" style="font-size:1.3rem;color:var(--crimson);font-weight:bold"></div>
                
                <div>
                    <span>Kích cỡ (Size):</span>
                    <div class="size-options" id="m-sizes">
                        <button class="size-btn active" data-size="M">M</button>
                        <button class="size-btn" data-size="L">L</button>
                        <button class="size-btn" data-size="XL">XL</button>
                        <button class="size-btn" data-size="May đo">May đo riêng</button>
                    </div>
                </div>

                <form id="m-form" style="margin-top:10px">
                    <input class="form-input" id="m-phone" required type="tel" placeholder="Số điện thoại Quý khách *" style="margin-bottom:8px">
                    <button class="btn-buy-now" type="submit" style="width:100%;padding:14px;font-size:1rem">ĐẶT NHANH GIAO TẬN NHÀ</button>
                </form>
            </div>
        </div>
    </div>

    <!-- GIỎ HÀNG -->
    <div id="cart-drawer" class="drawer-backdrop" hidden>
        <div class="drawer">
            <div class="drawer-head">
                <h3>Giỏ Hàng</h3>
                <button class="drawer-close" id="cart-close">&times;</button>
            </div>
            <div class="drawer-body">
                <div id="cart-items"></div>
                <form id="checkout-form" style="margin-top:20px" hidden>
                    <input class="form-input" id="ck-phone" type="tel" placeholder="SĐT Nhận Hàng *" required style="margin-bottom:8px">
                    <input class="form-input" id="ck-addr" placeholder="Địa chỉ giao hàng *" required style="margin-bottom:12px">
                    <button type="submit" class="btn-buy-now" style="width:100%;padding:14px">XÁC NHẬN ĐƠN HÀNG</button>
                </form>
            </div>
        </div>
    </div>

    <footer id="footer">
        <h2 style="color:var(--gold-light);margin-bottom:10px">HOÀNG OANH</h2>
        <p>Hotline / Zalo VIP: 0978 612 816</p>
    </footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzJhGs835s1DjxS4HwqfXJgqS9QTivgufnS5S1okYzN2JaKtS6FRNoG5TYoNBC6Z_TK/exec';
        let ALL = [
            { id: '1', ten: 'Váy Lụa Hoàng Gia', gia: '1.250.000đ', nhom: 'Đầm Lụa', hinh_anh: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500' },
            { id: '2', ten: 'Vest Công Sở Sang Trọng', gia: '1.550.000đ', nhom: 'Vest', hinh_anh: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500' }
        ];

        const $ = id => document.getElementById(id);
        
        function render() {
            $('product-container').innerHTML = ALL.map(p => `
                <div class="product-card" onclick="openModal('${p.id}')">
                    <div class="img-wrap"><img src="${p.hinh_anh}" class="product-img"></div>
                    <div class="product-info">
                        <h3>${p.ten}</h3><p class="product-price">${p.gia}</p>
                        <button class="btn-buy-now">ĐẶT MUA</button>
                    </div>
                </div>`).join('');
        }

        async function loadData() {
            render(); // Render fallback first
            try {
                const res = await fetch(API_URL + '?action=products');
                const json = await res.json();
                if (json.data) { ALL = json.data; render(); }
            } catch (e) {}
        }
        
        let cur = null, curSize = 'M';
        function openModal(id) {
            cur = ALL.find(x => x.id === id);
            $('m-img').src = cur.hinh_anh;
            $('m-prod').textContent = cur.ten;
            $('m-price').textContent = cur.gia;
            $('modal').hidden = false;
        }

        $('m-close').onclick = () => $('modal').hidden = true;
        
        $('m-sizes').onclick = (e) => {
            if(e.target.classList.contains('size-btn')) {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                curSize = e.target.dataset.size;
            }
        };

        $('m-form').onsubmit = (e) => {
            e.preventDefault();
            alert(`Cảm ơn Quý khách! Stylist sẽ gọi lại số ${$('m-phone').value} để chốt mẫu ${cur.ten} (Size ${curSize}).`);
            $('modal').hidden = true;
        };

        loadData();
    </script>
</body>
</html>
